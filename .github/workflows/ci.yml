name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (lint, types, boundaries, tests, build, e2e, stories, OpenAPI, secrets, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for the gitleaks git scan

      - uses: pnpm/action-setup@v4 # reads the pinned version from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Local-only environment (placeholders from .env.example)
        run: cp .env.example .env

      - name: Lint and format check
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Module boundaries (+ proof that violations are detected)
        run: pnpm boundaries

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (Testcontainers / PostgreSQL 17)
        run: pnpm test:int

      - name: Build
        run: pnpm build

      - name: Start PostgreSQL, migrate and seed the demo schools
        run: pnpm db:up && pnpm db:migrate && pnpm db:seed

      - name: Install Playwright browser
        run: pnpm --filter @studyhub/web exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm test:e2e

      - name: Design-system stories (axe in the default and 2 school themes)
        # Visual-regression baselines are recorded on Windows only so far (docs/design/m3-design-system.md §6),
        # so CI runs the accessibility half until Linux baselines are added.
        run: pnpm --filter @studyhub/ui build-storybook && pnpm --filter @studyhub/ui exec playwright test --grep axe

      - name: OpenAPI document is generated and up to date
        run: pnpm openapi && git diff --exit-code -- apps/api/openapi.json

      - name: Secret scan (gitleaks, full git history)
        run: node tools/gitleaks.mjs --git

      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            packages/ui/playwright-report
          retention-days: 7

      - name: Stop PostgreSQL
        if: always()
        run: pnpm db:down || true
