# Local development stack: PostgreSQL 17, Mailpit (catches all outgoing email; nothing is delivered) and
# SeaweedFS as a local S3-compatible object store (production: Cloudflare R2, ADR-008).
# Usage (from the repository root): pnpm db:up / pnpm db:down
# Values come from the root .env (copied from .env.example). Postgres is bound to localhost only.
name: studyhub-dev

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studyhub}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}
      # Read by infra/postgres/init/01-roles.sql via psql \getenv on first initialisation.
      STUDYHUB_MIGRATOR_PASSWORD: ${STUDYHUB_MIGRATOR_PASSWORD:?Set STUDYHUB_MIGRATOR_PASSWORD in .env}
      STUDYHUB_APP_PASSWORD: ${STUDYHUB_APP_PASSWORD:?Set STUDYHUB_APP_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - studyhub-pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ${POSTGRES_DB:-studyhub}']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.29
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025' # SMTP
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025' # web UI and API: http://127.0.0.1:8025
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

  objectstore:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    # Single-node server with the S3 gateway. Local-only credentials in infra/seaweedfs/s3.json.
    command: >-
      server -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=256 -volume.max=20
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -s3.allowedOrigins=*
    ports:
      - '127.0.0.1:${OBJECT_STORE_PORT:-8333}:8333' # S3 API: http://127.0.0.1:8333
    volumes:
      - studyhub-objects:/data
      - ../seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  studyhub-pgdata:
  studyhub-objects:
